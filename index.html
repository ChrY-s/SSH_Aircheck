<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Web Server</title>
</head>
<body>
  <h1>ESP32 Web Server - Dati in tempo reale</h1>

  <p>
    <span class="sensor-labels">Humidity </span>
    <span id="humidity">%HUMIDITY%</span>
  </p>

  <p>
    <span class="sensor-labels">Methane </span>
    <span id="methane">%METHANE%</span>
  </p>

  <p>
    <span class="sensor-labels">Co </span>
    <span id="co">%CO%</span>
  </p>

</body>

  <script>
    const updateSensorValue = (id, endpoint) => {
      fetch(endpoint)
        .then(response => {
          if (!response.ok) {
            throw new Error(`Failed to fetch ${endpoint}`);
          }
          return response.text();
        })
        .then(data => {
          document.getElementById(id).textContent = data;
        })
        .catch(error => {
          console.error(error);
          document.getElementById(id).textContent = 'Error';
        });
    };

    // Update all sensors every 2 second
    setInterval(() => {
      updateSensorValue('co', '/co');
      updateSensorValue('humidity', '/humidity');
      updateSensorValue('methane', '/methane');
    }, 2000);
  </script>

</html>
