<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircheck</title>
</head>
<body>
  <h1>Qualità dell'aria: Dati in tempo reale</h1>

  <h4>Indice di qualità</h4>
  <p>
    <span id="quality">%QUALITY%</span>
  </p>

  <p>
    <span class="sensor-labels">Umidità </span>
    <span id="humidity">%HUMIDITY%</span>
  </p>

  <p>
    <span class="sensor-labels">Metano </span>
    <span id="methane">%METHANE%</span>
  </p>

  <p>
    <span class="sensor-labels">Monossido di Carbonio </span>
    <span id="co">%CO%</span>
  </p>

  <h4>Vai ai dettagli</h4>
  <p>
    <a href="/details_humidity"><button class="button">Umidità</button></a>
    <a href="/details_methane"><button class="button">Metano</button></a>
    <a href="/details_co"><button class="button">CO</button></a>
  </p>

</body>

  <script>
    const updateSensorValue = (id, endpoint) => {
      fetch(endpoint)
        .then(response => {
          if (!response.ok) {
            throw new Error(`Failed to fetch ${endpoint}`);
          }
          return response.text();
        })
        .then(data => {
          document.getElementById(id).textContent = data;
        })
        .catch(error => {
          console.error(error);
          document.getElementById(id).textContent = 'Error';
        });
    };

    // Update all sensors every 2 second
    setInterval(() => {
      updateSensorValue('co', '/co');
      updateSensorValue('humidity', '/humidity');
      updateSensorValue('methane', '/methane');
      updateSensorValue('quality', '/quality');
    }, 2000);
  </script>

</html>
